<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title th:text="${roleDisplay} + ' Signup'">Register</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#43e97b,#38f9d7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:320px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#43e97b;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2ecc71;
}

a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#2ecc71;
    font-weight:bold;
}
</style>

</head>

<body>

<script th:if="${error}" th:inline="javascript">
alert([[${error}]]);
</script>

<div class="container">

<h2 th:text="${roleDisplay} + ' Registration'">Student Registration</h2>

<form action="/register" method="post">

<input type="hidden" name="role" th:value="${role}">

<input type="text" name="name" placeholder="Enter Name" required>

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Register</button>

</form>

<a th:href="${loginUrl}">Back to Login</a>
<a href="/">Back to Role Selection</a>

</div>

</body>
</html>
