<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Student Dashboard</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:450px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:20px;
}

.btn{
display:block;
margin:10px 0;
padding:10px;
background:#667eea;
color:white;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

.btn:hover{
background:#5563d1;
}

.notification-toast{
position:fixed;
top:20px;
right:20px;
width:min(420px,calc(100vw - 40px));
background:rgba(255,255,255,0.98);
border-left:6px solid #667eea;
border-radius:14px;
box-shadow:0 16px 40px rgba(0,0,0,0.25);
padding:16px;
z-index:9999;
animation:toastIn 0.28s ease-out;
}

.toast-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:10px;
}

.toast-header h4{
margin:0;
font-size:18px;
color:#1f2937;
}

.toast-close{
border:none;
background:#eef2ff;
color:#4338ca;
width:30px;
height:30px;
border-radius:50%;
cursor:pointer;
font-size:18px;
line-height:1;
}

.toast-items{
display:flex;
flex-direction:column;
gap:10px;
max-height:240px;
overflow:auto;
}

.toast-item{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:10px;
padding:10px 12px;
}

.toast-title{
font-weight:700;
color:#111827;
margin-bottom:4px;
}

.toast-message{
font-size:14px;
color:#374151;
line-height:1.4;
}

@keyframes toastIn{
from{transform:translateY(-12px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
}

th{
background:#667eea;
color:white;
}

</style>

</head>

<body>
<div class="notification-toast" id="notificationToast" th:if="${notifications != null and !notifications.isEmpty()}">
	<div class="toast-header">
		<h4>Notifications</h4>
		<button class="toast-close" type="button" aria-label="Close notifications" onclick="document.getElementById('notificationToast').style.display='none'">&times;</button>
	</div>
	<div class="toast-items">
		<div class="toast-item" th:each="n,iterStat : ${notifications}" th:if="${iterStat.index < 5}">
			<div class="toast-title" th:text="${n.title}">Title</div>
			<div class="toast-message" th:text="${n.message}">Message</div>
		</div>
	</div>
</div>

<script th:if="${notifications != null and !notifications.isEmpty()}">
setTimeout(function() {
	var toast = document.getElementById('notificationToast');
	if (toast) {
		toast.style.opacity = '0';
		toast.style.transform = 'translateY(-12px)';
		toast.style.transition = 'all 0.25s ease';
		setTimeout(function() { toast.style.display = 'none'; }, 250);
	}
}, 10000);
</script>

<div class="container">

<h2>Student Dashboard</h2>

<a class="btn" href="/courses">Enroll Course</a>

<a class="btn" href="/assignment">Submit Assignment</a>

<a class="btn" href="/chatbot">🤖 Ask AI Chatbot</a>

<a class="btn" href="/chatbot/history">📜 Chat History</a>

<a class="btn" href="/">Logout</a>

<h3>Enrolled Courses</h3>

<table>

<tr>
<th>Student</th>
<th>Course</th>
</tr>

<tr th:each="c : ${courses}">
<td th:text="${c.studentName}"></td>
<td th:text="${c.courseName}"></td>
</tr>

</table>

</div>

</body>
</html>
