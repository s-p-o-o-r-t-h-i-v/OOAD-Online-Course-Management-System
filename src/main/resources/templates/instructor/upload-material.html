<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Upload Material</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2335;--border:#2a2f45;--accent:#6c63ff;--accent2:#a78bfa;--text:#e2e8f0;--muted:#8892a4}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
    .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 0;z-index:100}
    .logo{padding:0 24px 28px;border-bottom:1px solid var(--border)}
    .logo h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent2)}
    .logo p{font-size:11px;color:var(--muted);margin-top:2px}
    nav{padding:20px 12px;flex:1}
    nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;transition:all .15s;margin-bottom:2px}
    nav a:hover,nav a.active{background:rgba(108,99,255,.12);color:var(--accent2)}
    nav a .icon{font-size:16px;width:20px;text-align:center}
    .main{margin-left:240px;padding:36px 40px;flex:1;display:flex;align-items:flex-start;justify-content:center}
    .form-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:560px;margin-top:20px}
    .form-card h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:6px}
    .form-card .subtitle{color:var(--muted);font-size:14px;margin-bottom:28px}
    .field{margin-bottom:20px}
    label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
    input[type=text],input[type=url],select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color .2s;outline:none}
    input:focus,select:focus{border-color:var(--accent)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:#5a52e0;transform:translateY(-1px)}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .btn-ghost:hover{color:var(--text);border-color:var(--text)}
    .form-footer{display:flex;gap:12px;margin-top:28px}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><h1>EduPortal</h1><p>Instructor Panel</p></div>
  <nav>
    <a href="/instructor/dashboard"><span class="icon">🏠</span> Dashboard</a>
    <a href="/instructor/course/new"><span class="icon">📚</span> Create Course</a>
    <a href="/instructor/material/new" class="active"><span class="icon">📎</span> Upload Material</a>
    <a href="/instructor/assignment/new"><span class="icon">📝</span> Assignment</a>
    <a href="/instructor/submissions"><span class="icon">✅</span> Submissions</a>
  </nav>
</aside>
<main class="main">
  <div class="form-card">
    <h2>Upload Material</h2>
    <p class="subtitle">Attach a learning resource to a course.</p>
    <form th:action="@{/instructor/material/save}" th:object="${material}" method="post">
      <div class="field">
        <label>Select Course</label>
        <select th:field="*{courseId}" required>
          <option value="">Choose a course</option>
          <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}">Course</option>
        </select>
      </div>
      <div class="field">
        <label>File Name</label>
        <input type="text" th:field="*{fileName}" placeholder="e.g. Week1_Lecture.pdf" required/>
      </div>
      <div class="field">
        <label>File URL / Link</label>
        <input type="url" th:field="*{fileUrl}" placeholder="https://drive.google.com/..." required/>
      </div>
      <div class="field">
        <label>File Type</label>
        <select th:field="*{fileType}">
          <option value="PDF">PDF</option>
          <option value="Video">Video</option>
          <option value="Slides">Slides</option>
          <option value="Document">Document</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary">📎 Upload Material</button>
        <a href="/instructor/dashboard" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
