<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Users</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #181c27;
        --surface2: #1e2335;
        --border: #2a2f45;
        --accent: #6c63ff;
        --accent2: #a78bfa;
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
        --text: #e2e8f0;
        --muted: #8892a4;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 0;
        z-index: 100;
      }
      .logo {
        padding: 0 24px 28px;
        border-bottom: 1px solid var(--border);
      }
      .logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        color: var(--accent2);
      }
      .logo p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      nav {
        padding: 20px 12px;
        flex: 1;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.15s;
        margin-bottom: 2px;
      }
      nav a:hover,
      nav a.active {
        background: rgba(108, 99, 255, 0.12);
        color: var(--accent2);
      }
      nav a .icon {
        font-size: 16px;
        width: 20px;
        text-align: center;
      }
      .main {
        margin-left: 240px;
        padding: 36px 40px;
        min-height: 100vh;
      }
      .page-header {
        margin-bottom: 32px;
      }
      .page-header h2 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 600;
      }
      .page-header p {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .card-header {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-header h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.purple {
        background: rgba(108, 99, 255, 0.18);
        color: var(--accent2);
      }
      .badge.green {
        background: rgba(52, 211, 153, 0.15);
        color: var(--green);
      }
      .badge.amber {
        background: rgba(251, 191, 36, 0.15);
        color: var(--amber);
      }
      .badge.red {
        background: rgba(248, 113, 113, 0.15);
        color: var(--red);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 12px 22px;
        text-align: left;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.7px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 14px 22px;
        font-size: 14px;
        border-bottom: 1px solid rgba(42, 47, 69, 0.5);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(108, 99, 255, 0.04);
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        padding: 5px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-family: "DM Sans", sans-serif;
      }
      .btn-toggle {
        background: rgba(251, 191, 36, 0.15);
        color: var(--amber);
      }
      .btn-toggle:hover {
        background: rgba(251, 191, 36, 0.3);
      }
      .btn-del {
        background: rgba(248, 113, 113, 0.15);
        color: var(--red);
      }
      .btn-del:hover {
        background: rgba(248, 113, 113, 0.3);
      }
      form {
        display: inline;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <h1>EduPortal</h1>
        <p>Admin Panel</p>
      </div>
      <nav>
        <a href="/admin/dashboard"><span class="icon">🏠</span> Dashboard</a>
        <a href="/admin/users" class="active"
          ><span class="icon">👥</span> Manage Users</a
        >
        <a href="/admin/courses"><span class="icon">📚</span> Manage Courses</a>
        <a href="/admin/reports"><span class="icon">📊</span> Reports</a>
        <a href="/admin/notifications"
          ><span class="icon">🔔</span> Notifications</a
        >
        <a href="/"><span class="icon">🚪</span> Logout</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <h2>Manage Users</h2>
        <p>Activate, deactivate, or remove user accounts from the system.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>All Users</h3>
          <span
            class="badge purple"
            th:text="${users != null ? users.size() + ' users' : '0 users'}"
            >0 users</span
          >
        </div>
        <div th:if="${users == null or users.isEmpty()}" class="empty">
          No users found.
        </div>
        <table th:if="${users != null and !users.isEmpty()}">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td th:text="${u.id}">—</td>
              <td th:text="${u.name}">—</td>
              <td th:text="${u.email}">—</td>
              <td>
                <span
                  class="badge purple"
                  th:text="${u.role != null ? u.role : 'STUDENT'}"
                  >STUDENT</span
                >
              </td>
              <td>
                <span class="badge green" th:if="${u.active}">Active</span>
                <span class="badge red" th:if="${!u.active}">Inactive</span>
              </td>
              <td>
                <form
                  th:action="@{/admin/users/{id}/toggle(id=${u.id})}"
                  method="post"
                  style="display: inline"
                >
                  <button
                    class="btn btn-toggle"
                    type="submit"
                    th:text="${u.active ? 'Deactivate' : 'Activate'}"
                  >
                    Toggle
                  </button>
                </form>
                <form
                  th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                  method="post"
                  style="display: inline"
                >
                  <button
                    class="btn btn-del"
                    type="submit"
                    onclick="return confirm('Delete this user?');"
                  >
                    Delete
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
