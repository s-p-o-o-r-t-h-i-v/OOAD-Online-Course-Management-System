<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Notifications</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #181c27;
        --surface2: #1e2335;
        --border: #2a2f45;
        --accent: #6c63ff;
        --accent2: #a78bfa;
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
        --text: #e2e8f0;
        --muted: #8892a4;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 0;
        z-index: 100;
      }
      .logo {
        padding: 0 24px 28px;
        border-bottom: 1px solid var(--border);
      }
      .logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        color: var(--accent2);
      }
      .logo p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      nav {
        padding: 20px 12px;
        flex: 1;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.15s;
        margin-bottom: 2px;
      }
      nav a:hover,
      nav a.active {
        background: rgba(108, 99, 255, 0.12);
        color: var(--accent2);
      }
      nav a .icon {
        font-size: 16px;
        width: 20px;
        text-align: center;
      }
      .main {
        margin-left: 240px;
        padding: 36px 40px;
        min-height: 100vh;
      }
      .page-header {
        margin-bottom: 32px;
      }
      .page-header h2 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 600;
      }
      .page-header p {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .card-header {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
      }
      .card-header h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .form-body {
        padding: 24px 22px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 500;
      }
      input[type="text"],
      select,
      textarea {
        width: 100%;
        padding: 10px 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        font-family: "DM Sans", sans-serif;
        outline: none;
        margin-bottom: 16px;
      }
      input[type="text"]:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      select option {
        background: var(--surface2);
      }
      .btn-send {
        padding: 10px 28px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
      }
      .btn-send:hover {
        background: #5a52d5;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.amber {
        background: rgba(251, 191, 36, 0.15);
        color: var(--amber);
      }
      .badge.purple {
        background: rgba(108, 99, 255, 0.18);
        color: var(--accent2);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 12px 22px;
        text-align: left;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.7px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 14px 22px;
        font-size: 14px;
        border-bottom: 1px solid rgba(42, 47, 69, 0.5);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(108, 99, 255, 0.04);
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <h1>EduPortal</h1>
        <p>Admin Panel</p>
      </div>
      <nav>
        <a href="/admin/dashboard"><span class="icon">🏠</span> Dashboard</a>
        <a href="/admin/users"><span class="icon">👥</span> Manage Users</a>
        <a href="/admin/courses"><span class="icon">📚</span> Manage Courses</a>
        <a href="/admin/reports"><span class="icon">📊</span> Reports</a>
        <a href="/admin/notifications" class="active"
          ><span class="icon">🔔</span> Notifications</a
        >
        <a href="/"><span class="icon">🚪</span> Logout</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-header">
        <h2>Notifications</h2>
        <p>Send announcements to users and view notification history.</p>
      </div>

      <!-- Send notification form -->
      <div class="card">
        <div class="card-header"><h3>🔔 Send New Notification</h3></div>
        <div class="form-body">
          <form action="/admin/notifications/send" method="post">
            <label>Notification Title</label>
            <input
              type="text"
              name="title"
              placeholder="e.g. System Maintenance on Sunday"
              required
            />

            <label>Message</label>
            <textarea
              name="message"
              placeholder="Type your notification message here..."
              required
            ></textarea>

            <label>Send To</label>
            <select name="sentTo">
              <option value="ALL">All Users</option>
              <option value="STUDENTS">Students Only</option>
              <option value="INSTRUCTORS">Instructors Only</option>
            </select>

            <button class="btn-send" type="submit">Send Notification 🔔</button>
          </form>
        </div>
      </div>

      <!-- History -->
      <div class="card">
        <div class="card-header"><h3>Notification History</h3></div>
        <div
          th:if="${notifications == null or notifications.isEmpty()}"
          class="empty"
        >
          No notifications sent yet.
        </div>
        <table th:if="${notifications != null and !notifications.isEmpty()}">
          <thead>
            <tr>
              <th>Title</th>
              <th>Message</th>
              <th>Sent To</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="n : ${notifications}">
              <td th:text="${n.title}">—</td>
              <td th:text="${n.message}">—</td>
              <td><span class="badge amber" th:text="${n.sentTo}">—</span></td>
              <td th:text="${n.sentAt}">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
