<!DOCTYPE html>

<html>
<head>
<title>Courses</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:350px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#ff758c;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#ff5e78;
}

a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#ff5e78;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Enroll in Course</h2>

<form action="/enroll" method="post">

<input type="text" name="studentName" placeholder="Student Name">

<input type="text" name="courseName" placeholder="Course Name">

<button type="submit">Enroll</button>

</form>

<a href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
